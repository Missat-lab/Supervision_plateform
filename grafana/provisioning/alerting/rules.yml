apiVersion: 1

groups:
  - orgId: 1
    name: alertes-plateforme
    folder: Supervision
    interval: 10s
    rules:

      # Franchissement du seuil de 80% d'utilisation processeur (section 3.8.2)
      - uid: cpu-charge-elevee
        title: "Charge processeur elevee (>80%)"
        condition: B
        for: 10s
        labels:
          severity: warning
          volet: systeme
        annotations:
          summary: "Utilisation CPU superieure a 80% sur {{ $labels.instance }}"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "__expr__"
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query

      # Indisponibilite d'un service supervise (cible Prometheus injoignable)
      - uid: service-indisponible
        title: "Service supervise indisponible"
        condition: B
        for: 10s
        labels:
          severity: critical
          volet: systeme
        annotations:
          summary: "La cible {{ $labels.instance }} (job {{ $labels.job }}) ne repond plus"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "__expr__"
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query

      # Indisponibilite d'une liaison reseau (sonde Blackbox en echec)
      - uid: liaison-reseau-indisponible
        title: "Liaison reseau indisponible"
        condition: B
        for: 10s
        labels:
          severity: critical
          volet: reseau
        annotations:
          summary: "La sonde vers {{ $labels.instance }} echoue"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: probe_success{job="reseau-icmp"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "__expr__"
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                  type: query
