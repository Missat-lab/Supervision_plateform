apiVersion: 1

# Supprime les anciennes sources (creees sans uid explicite lors d'essais
# precedents) avant de les recreer avec un uid stable, requis par les
# regles d'alerte provisionnees dans grafana/provisioning/alerting/.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:

  # Source Prometheus
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Source Loki
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100