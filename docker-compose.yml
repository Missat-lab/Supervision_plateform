services:
  # Service Prometheus : collecte des métriques
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volumes/prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring

  # Service Node Exporter : expose les métriques du système
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # Service Grafana : visualisation des données
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./volumes/grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  # Service Loki : stockage et gestion des logs
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - ./volumes/loki_data:/loki
    expose:
      - "3100"
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - monitoring

  # Service Nginx : reverse proxy avec authentification basique pour Prometheus et Loki
  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "9090:9090"
      - "3100:3100"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  # Service Promtail : collecte des logs
  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
