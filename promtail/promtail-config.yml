server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Logs système Linux
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  # Logs Docker
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: dockerlogs
          __path__: /var/lib/docker/containers/*/*.log

  # Alertes de securite qualifiees par Wazuh (section 3.7.4 du rapport)
  - job_name: wazuh-alerts
    static_configs:
      - targets:
          - localhost
        labels:
          job: wazuh
          __path__: /var/log/wazuh/alerts/alerts.json
    pipeline_stages:
      - json:
          expressions:
            rule_level: rule.level
            rule_description: rule.description
            agent_name: agent.name
      - labels:
          rule_level:
          agent_name: